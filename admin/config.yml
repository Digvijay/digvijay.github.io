backend:
  name: github
  repo: digvijay/ghblog # Replace with your github_username/repo_name
  branch: main
  base_url: https://decap-oauth-worker.YOUR_SUBDOMAIN.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
